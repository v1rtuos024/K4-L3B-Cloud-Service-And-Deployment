name: CI/CD

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # CP5 needs a live deployment. The badge becomes passing only after CI ends.
      - name: Run tests
        run: python -m pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py -k "not test_badge_bao_passing"

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -t day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy the tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL repository secret before deploying."
            exit 1
          fi
          if [[ "${RENDER_DEPLOY_HOOK_URL}" != https://api.render.com/deploy/* ]]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL must be the Render deploy hook URL."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
