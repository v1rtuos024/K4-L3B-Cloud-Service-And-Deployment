# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# CP5 — Web service Docker và Key Value trên Render.
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu secret vào repo.

services:
  - type: web
    name: day12-agent
    runtime: docker
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # GitHub Actions deploys the tested commit through the secret deploy hook.
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          name: day12-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: day12-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
